[project]
name = "boardsim"
version = "0.1.0"
description = "Zybo Z7 and Basys3 boards without the hardware: QEMU, GHDL and a live board view"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "conan>=2.10",
]

[project.scripts]
boardsim = "boardsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boardsim"]
