[project]
name = "boardsim"
version = "0.1.0"
description = "Zybo Z7 and Basys3 boards without the hardware: QEMU, GHDL and a live board view"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "conan>=2.10",
]

[project.scripts]
boardsim = "boardsim.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Prefer an installed Python over one uv downloads. On some Windows machines, security
# policies (Smart App Control, AppLocker, ...) block the unsigned Python builds uv
# downloads; with a system Python installed, uv uses that instead.
python-preference = "system"
