# Runs `boardsim test` (GHDL testbenches + the ARM programs in QEMU) on all three OSes.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install GHDL (the way the README says)
        run: uv run boardsim install ghdl

      - name: Install Surfer (checks the download; CI can't open the GUI)
        run: uv run boardsim install surfer

      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Install QEMU (Windows)
        if: runner.os == 'Windows'
        run: choco install qemu -y --no-progress

      - name: Cache Conan (Arm toolchain, CMake, Ninja)
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conan/**') }}

      - run: uv run boardsim doctor

      - name: One assignment of each kind from the templates (boardsim test includes them)
        # one line with &&: on Windows (pwsh) a failure in an earlier line of a block isn't fatal
        run: uv run boardsim new zybo ci_ip && uv run boardsim new zybo ci_gpio --gpio && uv run boardsim new basys3 ci_basys3

      - run: uv run boardsim test
